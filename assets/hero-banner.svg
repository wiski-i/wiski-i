<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="indigoGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .pulsing-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    .hud-mono {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
      letter-spacing: 1.5px;
    }
    .title-font {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .body-font {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 500;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />
  <rect width="1200" height="320" rx="16" fill="url(#indigoGlow)" />
  <rect width="1200" height="320" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="320" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Outer Glass Frame -->
  <g transform="translate(24, 24)">
    <!-- Top System Telemetry Bar -->
    <g transform="translate(20, 18)">
      <!-- Pulsing Online Badge -->
      <rect x="0" y="0" width="185" height="26" rx="13" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="13" r="4.5" fill="#10b981" class="pulsing-dot" />
      <text x="27" y="17" fill="#34d399" font-size="10.5" font-weight="700" class="hud-mono">SYSTEMS OPERATIONAL</text>

      <!-- Sub-label -->
      <text x="200" y="17" fill="#64748b" font-size="11" font-weight="600" class="hud-mono">// STARLIT PRODUCTION INFRASTRUCTURE</text>

      <!-- Right HUD Info -->
      <text x="1110" y="17" text-anchor="end" fill="#475569" font-size="11" font-weight="600" class="hud-mono">LATENCY &lt; 4MS • ENGINE 64-TICK</text>
    </g>

    <!-- Main Branding Header -->
    <g transform="translate(20, 85)">
      <!-- Eyebrow Tag -->
      <text x="0" y="0" fill="#818cf8" font-size="13" font-weight="700" class="hud-mono">CO-FOUNDER &amp; LEAD SYSTEMS ARCHITECT</text>

      <!-- Name Title -->
      <text x="0" y="60" fill="url(#textGrad)" font-size="64" class="title-font">WISKI</text>

      <!-- Professional Subtitle -->
      <text x="235" y="55" fill="#94a3b8" font-size="21" class="body-font">
        Game Systems Architect <tspan fill="#38bdf8">•</tspan> Full-Stack Engineer <tspan fill="#38bdf8">•</tspan> Starlit Roleplay
      </text>

      <!-- One-line mission statement -->
      <text x="2" y="95" fill="#64748b" font-size="14.5" class="body-font">
        Architecting high-frequency FiveM game runtimes, zero-trust auth services, and pixel-perfect Liquid Glass NUI systems.
      </text>
    </g>

    <!-- Interactive / Status Metrics Pills -->
    <g transform="translate(20, 222)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="250" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#6366f1" />
        <text x="16" y="21" fill="#cbd5e1" font-size="12" font-weight="600" class="body-font">FiveM Core (Lua 5.4 / TS)</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(262, 0)">
        <rect width="265" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#38bdf8" />
        <text x="16" y="21" fill="#cbd5e1" font-size="12" font-weight="600" class="body-font">Liquid Glass NUI (React 19 / CEF)</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(539, 0)">
        <rect width="285" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#a855f7" />
        <text x="16" y="21" fill="#cbd5e1" font-size="12" font-weight="600" class="body-font">High-Scale Backend (Fastify / Redis / PG)</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(836, 0)">
        <rect width="275" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#10b981" />
        <text x="16" y="21" fill="#cbd5e1" font-size="12" font-weight="600" class="body-font">Zero-Trust &amp; Identity Security</text>
      </g>
    </g>
  </g>
</svg>
