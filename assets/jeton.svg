<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" role="img" aria-labelledby="title description">
  <title id="title">Wiski · Full-Stack Developer</title>
  <desc id="description">Game systems, web interfaces and backend services. An arcade screen lights up as a pixel coin drops into its slot.</desc>
  <style>
    text { font-family: Consolas, 'Courier New', monospace; font-weight: 700; letter-spacing: .12em; }
    .pixel { fill: none; stroke-width: 12; stroke-linecap: square; stroke-linejoin: miter; shape-rendering: crispEdges; }
    .letter { animation: enter .45s steps(5) both; }
    .role { animation: light-up .3s 1.25s both; }
    .coin { opacity: 0; animation: insert .65s steps(9) 1.75s; }
    .slot { animation: credit .5s 2.4s both; }
    .credit { animation: light-up .3s 2.4s both; }
    @keyframes enter {
      from { opacity: 0; transform: translateY(-58px); }
    }
    @keyframes light-up {
      from { opacity: 0; }
    }
    @keyframes insert {
      from { opacity: 1; transform: translateY(-43px); }
      88% { opacity: 1; }
      to { opacity: 0; transform: translateY(11px); }
    }
    @keyframes credit {
      from { fill: #382c4e; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0h4v2H0z" fill="#000" opacity=".20"/>
    </pattern>
    <radialGradient id="screen" cx=".5" cy=".37" r=".72">
      <stop offset="0" stop-color="#21143a"/>
      <stop offset=".72" stop-color="#0f091c"/>
      <stop offset="1" stop-color="#080610"/>
    </radialGradient>
    <g id="W"><path d="M6 6V78H54V6M30 42V78"/></g>
    <g id="I"><path d="M6 6H30M18 6V78M6 78H30"/></g>
    <g id="S"><path d="M54 6H6V42H54V78H6"/></g>
    <g id="K"><path d="M6 6V78M6 42H30V30H42V18H54V6M30 42V54H42V66H54V78"/></g>
    <g id="wordmark">
      <g class="letter" style="animation-delay:.12s"><use href="#W"/></g>
      <g class="letter" style="animation-delay:.29s"><use href="#I" x="74"/></g>
      <g class="letter" style="animation-delay:.46s"><use href="#S" x="124"/></g>
      <g class="letter" style="animation-delay:.63s"><use href="#K" x="198"/></g>
      <g class="letter" style="animation-delay:.8s"><use href="#I" x="272"/></g>
    </g>
  </defs>

  <rect width="880" height="414" rx="30" fill="#07050d"/>
  <rect x="12" y="12" width="856" height="390" rx="23" fill="url(#screen)" stroke="#39284f" stroke-width="2"/>
  <rect x="20" y="20" width="840" height="374" rx="17" fill="url(#scanlines)"/>

  <g fill="#ffe39a" opacity=".72" shape-rendering="crispEdges">
    <path d="M76 58h4v4h-4zM115 154h4v4h-4zM786 85h4v4h-4zM796 241h4v4h-4zM90 309h4v4h-4z"/>
  </g>
  <g transform="translate(193 58) scale(1.6)">
    <use href="#wordmark" class="pixel" stroke="#42dfff" x="4" y="4"/>
    <use href="#wordmark" class="pixel" stroke="#ff568f"/>
  </g>

  <g class="role" text-anchor="middle">
    <text x="440" y="232" font-size="29" fill="#69e6ff">FULL-STACK DEVELOPER</text>
    <text x="440" y="272" font-size="18" fill="#eee7f8">GAME SYSTEMS · WEB UI · BACKEND</text>
  </g>

  <path d="M260 300h360" stroke="#3b2c54"/>
  <g class="coin" shape-rendering="crispEdges">
    <path d="M432 324h16v4h4v16h-4v4h-16v-4h-4v-16h4z" fill="#ffe17c"/>
    <path d="M438 330h4v12h-4z" fill="#a76421"/>
  </g>
  <rect x="412" y="349" width="56" height="11" rx="5.5" fill="#07050d" stroke="#533868"/>
  <rect class="slot" x="421" y="353" width="38" height="3" rx="1.5" fill="#ffe17c"/>
  <text class="credit" x="440" y="384" text-anchor="middle" font-size="14" fill="#d3bbeb">CREDIT 01</text>
</svg>
