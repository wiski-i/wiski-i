name: Update repository cards

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-cards.yml'
      - 'scripts/update-repository-cards.py'

concurrency:
  group: profile-repository-cards

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Render the public project cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-repository-cards.py
      - name: Commit any changes
        run: |
          git add -A -- README.md assets
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile repository cards'
          git push
